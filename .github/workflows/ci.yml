name: checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . -r requirements-test.txt
      - run: python -m pytest -q
      - run: ruff check --select F,E9 msv2 tests
      - run: ruff format --check msv2 tests
      - run: bash -n deploy.sh msv2.sh scripts/bootstrap.sh
