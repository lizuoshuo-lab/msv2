[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msv2-pipeline"
version = "0.1.0"
description = "Video and COLMAP to portable Mini-Splatting2 Gaussian scenes"
requires-python = ">=3.10,<3.12"
dependencies = ["numpy>=1.26,<2", "Pillow>=10,<12"]

[project.scripts]
msv2 = "msv2.cli:main"

[tool.setuptools.packages.find]
include = ["msv2*"]

[tool.setuptools.package-data]
msv2 = ["roi_backend.patch"]
